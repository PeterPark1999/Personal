<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gyu</title>
<meta name="description" content="gyu — architecture and interior photography. 건축·인테리어 사진.">
<meta property="og:type" content="website">
<meta property="og:title" content="gyu">
<meta property="og:description" content="Architecture and interior photography. 건축·인테리어 사진.">
<meta property="og:image" content="https://peterpark1999.github.io/Personal/img/dsc9142.jpg">
<meta property="og:url" content="https://peterpark1999.github.io/Personal/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="fonts/hanken-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family: "Hanken Grotesk";
  src: url(fonts/hanken-grotesk.woff2) format("woff2");
  font-weight: 100 900;
  font-display: swap;
}
:root {
  --margin: 13px;      /* 화면 가장자리 여백 */
  --col-gap: 16px;     /* 사진 사이 가로 간격 */
  --row-gap: 16px;     /* 줄 사이 세로 간격 */
  --cols: 8;           /* 한 줄 사진 수 */
  --ink: #222;
  --grey: #6f6f6f;
  --font: "Hanken Grotesk", "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: #fff; }
body {
  background: #fff; color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
a { color: inherit; text-decoration: none; }

/* 왼쪽 위 gyu, 오른쪽 위 Index, Information (사진 위에 떠 있음) */
.logo {
  position: fixed; z-index: 10;
  top: calc(var(--margin) - 2px); left: calc(var(--margin) - 1px);
  font-size: 39px; font-weight: 700; line-height: 1; letter-spacing: -0.01em;
}
.nav {
  position: fixed; z-index: 10;
  top: calc(var(--margin) + 1px); right: var(--margin);
  font-size: 20.5px; font-weight: 400; line-height: 1.2;
}
.nav a:hover, .list a:hover .t, .info a:hover { color: var(--grey); }
.nav a[aria-current="page"] { color: var(--grey); }

/* 사진 그리드 */
.grid {
  display: grid;
  grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  column-gap: var(--col-gap); row-gap: var(--row-gap);
  align-items: start;
  padding: var(--margin);
}
.tile { display: block; cursor: zoom-in; }
.tile img { display: block; width: 100%; height: auto; background: #f2f2f2; }
.cap {
  margin-top: 6px;
  font-size: 13px; font-weight: 600; line-height: 14.6px;
  color: var(--grey);
}

/* Index, Information 화면 */
.page { padding: 84px var(--margin) 60px; font-size: 20px; line-height: 1.25; }
.list li { list-style: none; }
.list a { display: inline-block; padding: 1px 0; }
.list .m { color: var(--grey); }
.info p { max-width: 34em; }
.info p + p, .info ul { margin-top: 1.25em; }
.info li { list-style: none; }
[hidden] { display: none !important; }

/* 사진 크게 보기 */
.zoom {
  position: fixed; inset: 0; z-index: 20; background: #fff;
  display: flex; align-items: center; justify-content: center;
  padding: 50px var(--margin) 44px;
  user-select: none; -webkit-user-select: none;
}
.zoom img { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; }
.zoom .prev, .zoom .next { position: absolute; top: 0; bottom: 0; }
.zoom .prev { left: 0; width: 40%; cursor: w-resize; }
.zoom .next { right: 0; width: 60%; cursor: e-resize; }
.zoom .close {
  position: absolute; top: calc(var(--margin) + 1px); right: var(--margin); z-index: 1;
  font-size: 20px; line-height: 1.2; cursor: pointer; background: none; border: 0; font-family: inherit; color: var(--ink);
}
.zoom .close:hover { color: var(--grey); }
.zoom .zcap {
  position: absolute; left: var(--margin); bottom: var(--margin);
  font-size: 13px; font-weight: 600; line-height: 14.6px; color: var(--grey);
}
.zoom .count { left: auto; right: var(--margin); }

@media (max-width: 1000px) { :root { --cols: 4; } }
@media (max-width: 560px) {
  :root { --cols: 2; --col-gap: 10px; --row-gap: 16px; --margin: 10px; }
  /* 폰에서는 글자가 사진에 묻히지 않게 사진 위쪽에 따로 둠 */
  .logo { position: absolute; font-size: 32px; }
  .nav { position: absolute; font-size: 16px; top: calc(var(--margin) + 6px); }
  .grid { padding-top: 54px; }
  .page { padding-top: 64px; font-size: 17px; }
  .zoom { padding: 44px 0 40px; }
}
</style>
</head>
<body>

<a class="logo" href="#">gyu</a>
<nav class="nav"><a href="#index">Index</a>, <a href="#information">Information</a></nav>

<main class="grid" id="grid"></main>

<section class="page" id="index" hidden>
  <ul class="list" id="list"></ul>
</section>

<section class="page info" id="information" hidden></section>

<div class="zoom" id="zoom" hidden>
  <img id="zimg" alt="">
  <div class="prev" id="zprev"></div>
  <div class="next" id="znext"></div>
  <button class="close" id="zclose" type="button">Close</button>
  <div class="zcap" id="zcap"></div>
  <div class="zcap count" id="zcount"></div>
</div>

<script src="photos.js"></script>
<script>
(function () {
  var projects = {};
  PROJECTS.forEach(function (p) { projects[p.id] = p; });

  function label(p) {
    return p.title + (p.credit ? ", " + p.credit : "") + (p.type ? " (" + p.type + ")" : "");
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  var grid = document.getElementById("grid");

  function renderGrid(filter) {
    grid.textContent = "";
    var shown = PHOTOS.filter(function (ph) { return !filter || ph.project === filter; });
    shown.forEach(function (ph, i) {
      var a = el("a", "tile");
      a.href = "img/" + ph.file + ".jpg";
      var img = el("img");
      img.src = "img/" + ph.file + "-s.jpg";
      img.width = ph.w; img.height = ph.h;
      img.alt = projects[ph.project] ? projects[ph.project].title : "";
      if (i > 15) img.loading = "lazy";
      a.appendChild(img);
      if (ph.caption && projects[ph.project]) a.appendChild(el("div", "cap", label(projects[ph.project])));
      a.addEventListener("click", function (e) {
        if (e.metaKey || e.ctrlKey || e.shiftKey) return;
        e.preventDefault(); open(ph);
      });
      grid.appendChild(a);
    });
  }

  var list = document.getElementById("list");
  PROJECTS.forEach(function (p) {
    var n = PHOTOS.filter(function (ph) { return ph.project === p.id; }).length;
    var li = el("li"), a = el("a");
    a.href = "#/" + p.id;
    a.appendChild(el("span", "t", p.title + (p.credit ? ", " + p.credit : "")));
    a.appendChild(el("span", "m", " " + [p.type, p.year].filter(Boolean).join(", ")));
    li.appendChild(a); list.appendChild(li);
  });

  var info = document.getElementById("information");
  info.appendChild(el("p", null, INFO.text));
  if (INFO.contact && INFO.contact.length) {
    var ul = el("ul");
    INFO.contact.forEach(function (c) {
      var li = el("li"), a = el("a", null, c.label);
      a.href = c.url;
      if (/^https?:/.test(c.url)) { a.target = "_blank"; a.rel = "noopener"; }
      li.appendChild(a); ul.appendChild(li);
    });
    info.appendChild(ul);
  }

  // 화면 전환: #index, #information, #/프로젝트, 그 외는 전체 그리드
  var current;
  function route() {
    var h = location.hash.replace(/^#/, "");
    var page = h === "index" || h === "information" ? h : "grid";
    var filter = h.indexOf("/") === 0 && projects[h.slice(1)] ? h.slice(1) : null;
    document.getElementById("index").hidden = page !== "index";
    document.getElementById("information").hidden = page !== "information";
    grid.hidden = page !== "grid";
    document.querySelectorAll(".nav a").forEach(function (a) {
      if (a.getAttribute("href") === "#" + page) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    if (page === "grid" && filter !== current) { renderGrid(filter); current = filter; }
    window.scrollTo(0, 0);
    close();
  }
  window.addEventListener("hashchange", route);

  // 사진 크게 보기: 누른 사진이 속한 프로젝트의 사진만 넘겨 봐요.
  // 순서는 PROJECTS의 slides, 없으면 그리드에 나온 순서예요.
  var zoom = document.getElementById("zoom"), zimg = document.getElementById("zimg");
  var slides = [], at = 0, slideProject = null;
  function slidesFor(pid) {
    var p = projects[pid];
    if (p && p.slides && p.slides.length) return p.slides.slice();
    return PHOTOS.filter(function (ph) { return ph.project === pid; }).map(function (ph) { return ph.file; });
  }
  function show(i) {
    at = (i + slides.length) % slides.length;
    zimg.src = "img/" + slides[at] + ".jpg";
    zimg.alt = slideProject ? slideProject.title : "";
    document.getElementById("zcap").textContent = slideProject ? label(slideProject) : "";
    document.getElementById("zcount").textContent = (at + 1) + " / " + slides.length;
    if (slides.length > 1) { var next = new Image(); next.src = "img/" + slides[(at + 1) % slides.length] + ".jpg"; }
  }
  function open(ph) {
    slides = slidesFor(ph.project);
    slideProject = projects[ph.project] || null;
    var i = slides.indexOf(ph.file);
    if (i < 0) { slides.unshift(ph.file); i = 0; }
    document.getElementById("zprev").hidden = document.getElementById("znext").hidden = slides.length < 2;
    show(i); zoom.hidden = false; document.body.style.overflow = "hidden";
  }
  function close() { zoom.hidden = true; document.body.style.overflow = ""; }
  document.getElementById("zprev").onclick = function () { show(at - 1); };
  document.getElementById("znext").onclick = function () { show(at + 1); };
  document.getElementById("zclose").onclick = close;
  document.addEventListener("keydown", function (e) {
    if (zoom.hidden) return;
    if (e.key === "Escape") close();
    else if (e.key === "ArrowLeft") show(at - 1);
    else if (e.key === "ArrowRight") show(at + 1);
  });
  var tx = null;
  zoom.addEventListener("touchstart", function (e) { tx = e.touches[0].clientX; }, { passive: true });
  zoom.addEventListener("touchend", function (e) {
    if (tx == null) return;
    var dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 40) show(at + (dx < 0 ? 1 : -1));
  });

  route();
})();
</script>
</body>
</html>
